name: Insmed
description: 'Insmed Incorporated is a NASDAQ-listed (INSM) global biopharmaceutical company
  developing and commercializing therapies for people with serious and rare diseases. Its
  approved medicines include ARIKAYCE (amikacin liposome inhalation suspension) for refractory
  Mycobacterium avium complex lung disease and BRINSUPRI (brensocatib) for bronchiectasis. The
  company advances a pipeline across pulmonary, inflammatory, and rare-disease indications and
  runs early-innovation science platforms in gene therapy with targeted delivery, protein
  deimmunization, RNA end-joining, and synthetic rescue. Insmed operates patient-facing surfaces
  such as a clinical-trials portal and an investigator-initiated-research program, but publishes
  no public developer API, OpenAPI, or developer portal at this time. This profile was surfaced
  as a Bessemer Venture Partners portfolio lead and enriched with identity and domain-security
  data only.'
